# ── Tema ─────────────────────────────────────────────────────────────────────
[theme]
mode = "dark"
source = "builtin"       # builtin | wallpaper | community
builtin = "Tokyo-Night"  # combina con niri (focus ring) y Ghostty
sync_color_scheme = true

[theme.templates]
enable_community_templates = true
community_ids = ["obsidian", "lazyvim"]   # lazyvim: genera nvim/colors/noctalia.lua

# ── Shell ────────────────────────────────────────────────────────────────────
[shell]
corner_radius_scale = 1.2
font_family = "JetBrainsMono Nerd Font"
avatar_path = "/home/cedric/nixos-config/dotfiles/profile/pluvium.jpg"

[shell.animation]
enabled = true
speed = 1.0

[shell.shadow]
direction = "down_right"
alpha = 0.55

[shell.panel]
transparency_mode = "glass"   # solid | soft | glass
borders = true
border_color = "primary"
border_width = 1.5
shadow = true
list_item_background = true
launcher_placement = "floating"
launcher_position = "center"
clipboard_placement = "floating"
clipboard_position = "center"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "floating"   # menú de apagado (Mod+Shift+Q) centrado como en la v4
session_position = "center"

# ── Wallpaper ────────────────────────────────────────────────────────────────
[wallpaper]
enabled = true
fill_mode = "crop"
fill_color = "#000000"
transition_duration = 1500
directory = "/home/cedric/nixos-config/dotfiles/wallpapers"

[backdrop]             # fondo difuminado en el overview de niri
enabled = true
blur_intensity = 0.4
tint_intensity = 0.6

# ── Barra ────────────────────────────────────────────────────────────────────
[bar.default]
position = "top"
thickness = 36
background_opacity = 0.0    # fondo invisible: solo se ven las cápsulas de los widgets
compositor_blur = false   # sin blur detrás de la barra vacía
radius = 0               # pegada al borde: sin esquinas redondeadas
margin_edge = 0          # sin hueco entre la barra y el borde superior
margin_ends = 15        # separación desde los lados (más grande = secciones más juntas)
padding = 6
widget_spacing = 3
shadow = false
capsule = true
capsule_fill = "surface_container"
capsule_opacity = 0.85
capsule_border = "outline_variant"
capsule_border_width = 1.0

# Igual que el layout por defecto, pero sin launcher ni red, y con CPU/RAM/GPU
start  = ["workspaces"]
center = ["clock"]
end    = ["cpu", "ram", "gpu", "media"]

# Monitores de rendimiento (widget sysmon, una instancia por métrica)
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.ram]
type = "sysmon"
stat = "ram_pct"

[widget.gpu]
type = "sysmon"
stat = "gpu_usage"

[widget.clock]
format = "{:%H:%M}"
tooltip_format = "{:%A, %d %B %Y}"
font_weight = 700
font_scale = 1.3   # hora más grande

# ── Notificaciones / OSD ─────────────────────────────────────────────────────
[notification]
background_opacity = 0.85
border = true
border_color = "primary"

[osd]
background_opacity = 0.85
border = true
border_color = "primary"

# ── Lockscreen ───────────────────────────────────────────────────────────────
[lockscreen]
enabled = true
blur_intensity = 0.7
tint_intensity = 0.45
transition_duration = 1500

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = ["lock-clock@DP-1", "lockscreen-login-box@DP-1"]

[lockscreen_widgets.widget."lock-clock@DP-1"]
type = "clock"
output = "DP-1"
cx = 1720.0
cy = 430.0
box_width = 720.0
box_height = 260.0
rotation = 0.0

[lockscreen_widgets.widget."lock-clock@DP-1".settings]
format = "{:%H:%M}"
center_text = true
background = false
color = "primary"
shadow = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
type = "login_box"
output = "DP-1"
cx = 1720.0
cy = 1258.0
box_width = 810.0
box_height = 196.0
rotation = 0.0

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
background_color = "surface_container"
background_opacity = 0.75
background_radius = 16.0
input_opacity = 1.0
input_radius = 8.0
layout = "regular"
center_password_text = false
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
